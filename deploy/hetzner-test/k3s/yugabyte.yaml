apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yb-data
  namespace: filecoin-gateway
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: yugabyte
  namespace: filecoin-gateway
spec:
  clusterIP:  # regular service, always resolvable
  selector:
    app: yugabyte
  ports:
    - name: ysql
      port: 5433
      targetPort: 5433
    - name: ycql
      port: 9042
      targetPort: 9042
    - name: master-web
      port: 7000
      targetPort: 7000
    - name: tserver-web
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yugabyte
  namespace: filecoin-gateway
spec:
  serviceName: yugabyte
  replicas: 1
  selector:
    matchLabels:
      app: yugabyte
  template:
    metadata:
      labels:
        app: yugabyte
    spec:
      containers:
        - name: yugabyte
          image: docker.io/yugabytedb/yugabyte:2024.2.5.0-b59
          command:
            - bin/yugabyted
            - start
            - --background=false
            - --advertise_address=$(POD_IP)
            - --tserver_flags=rocksdb_max_background_compactions=8,rocksdb_max_background_flushes=4,db_block_cache_size_bytes=536870912,tablet_server_svc_queue_length=10000
            - --master_flags=default_memory_limit_to_ram_ratio=0.25
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: YSQL_DB
              value: filecoingw
            - name: YCQL_KEYSPACE
              value: filecoingw
          ports:
            - containerPort: 5433
              name: ysql
            - containerPort: 9042
              name: ycql
            - containerPort: 7000
              name: master-web
            - containerPort: 9000
              name: tserver-web
          volumeMounts:
            - name: yb-data
              mountPath: /root/var
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "16"
              memory: 8Gi
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - >
                  bin/ysqlsh -h $(hostname -i) -U yugabyte -tAc 'select 1' -d yugabyte &&
                  bin/ycqlsh $(hostname -i) -e 'describe keyspaces'
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - bin/ysqlsh -h $(hostname -i) -U yugabyte -tAc 'select 1' -d yugabyte
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: yb-data
          persistentVolumeClaim:
            claimName: yb-data
