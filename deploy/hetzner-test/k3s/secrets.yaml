# THIS FILE IS NOT USED BY KUSTOMIZE.
#
# secrets are managed two ways:
#
# 1. fgw-secrets (env vars): generated by kustomize from secrets.env
#    cp secrets.env.example secrets.env && $EDITOR secrets.env
#
# 2. wallet-keys (binary key files): created out-of-band
#    kubectl create secret generic wallet-keys \
#      --from-file=/var/mnt/fgw/wallet/ \
#      -n filecoin-gateway
#
# WARNING: do not add this file or a generic Secret template to
# kustomization.yaml resources. applying a Secret with `data: {}`
# will silently overwrite real secrets, causing kuri to regenerate
# the wallet with a new (unfunded) address (F23).
